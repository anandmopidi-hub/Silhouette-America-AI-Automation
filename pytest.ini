[pytest]
# Test Discovery Settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Execution and HTML Reporting Options
# Automatically outputs all executed tests to single centralized custom HTML report
addopts = 
    -v
    -s
    --capture=no
    -p no:html

# Pre-registered Test Markers
markers =
    smoke: Critical path smoke tests for quick sanity checks
    functional: Functional verification tests for navigation and feature flows
    regression: Comprehensive regression test suite
    sanity: Sanity tests for basic functionality verification
    checkout: Checkout, payment, and order processing flows
    login: User authentication, registration, and account management tests
    my_account: Customer account, profile, address, order, license, and wishlist tests
    negative: Negative testing and error validation scenarios
    e2e: End-to-end integration workflows across multiple features

# Centralized Logging Configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/automation.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
